<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Assistant de Cours | LearnWorlds</title>
    <meta name="description" content="Assistant de cours alimenté par l'IA pour LearnWorlds. Posez des questions sur le contenu de vos cours et obtenez des réponses précises." />
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" href="/images/teacher_professional.jpg">
    <!-- Preload fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Open Graph tags -->
    <meta property="og:title" content="Assistant de Cours | LearnWorlds" />
    <meta property="og:description" content="Chatbot intelligent pour répondre à vos questions sur le contenu des cours" />
    <meta property="og:type" content="website" />

    <!-- Advanced Custom Element Conflict Resolution System -->
    <script>
      (function() {
        // Early protection system - immediately prevent known problematic elements
        console.log('🛡️ Initializing advanced custom element protection system...');

        const originalDefine = window.customElements.define;
        const blockedElements = new Set([
          'mce-autosize-textarea', 
          'autosize-textarea',
          'vite-error-overlay',
          'replit-error-overlay',
          'webcomponent-error-overlay',
          'cartographer-overlay',
          'runtime-error-modal',
          'dev-error-overlay',
          'webpack-dev-server-client',
          'hot-reload-overlay'
        ]);

        const blockedPatterns = [
          /^mce-.*$/,
          /^vite-.*-overlay$/,
          /^replit-.*-overlay$/,
          /^dev-.*-overlay$/,
          /^error-.*-modal$/,
          /^runtime-.*-overlay$/
        ];

        let protectionMetrics = {
          blocked: 0,
          allowed: 0,
          errors: 0
        };

        function shouldBlock(name) {
          if (blockedElements.has(name)) return true;
          if (blockedPatterns.some(pattern => pattern.test(name))) return true;
          if (window.customElements.get(name)) return true;
          return false;
        }

        // Enhanced protection method
        window.customElements.define = function(name, constructor, options) {
          try {
            if (shouldBlock(name)) {
              protectionMetrics.blocked++;
              console.warn(`🚫 BLOCKED: "${name}" - protection active`);
              return;
            }

            protectionMetrics.allowed++;
            return originalDefine.call(this, name, constructor, options);
          } catch (error) {
            if (error.message && error.message.includes('already been defined')) {
              protectionMetrics.blocked++;
              console.warn(`🔄 CONFLICT RESOLVED: "${name}" already defined`);
              return;
            }
            throw error;
          }
        };

        // Comprehensive error handling
        function preventCustomElementErrors(event) {
          if (event.error && event.error.message) {
            const message = event.error.message;
            if (message.includes('already been defined') || 
                message.includes('custom element') ||
                message.includes('mce-autosize-textarea')) {
              protectionMetrics.errors++;
              console.warn('🛡️ Protected against custom element error:', message);
              event.preventDefault();
              event.stopPropagation();
              return false;
            }
          }
        }

        window.addEventListener('error', preventCustomElementErrors, true);
        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && typeof event.reason === 'object') {
            const message = String(event.reason.message || event.reason);
            if (message.includes('already been defined') || message.includes('custom element')) {
              protectionMetrics.errors++;
              console.warn('🛡️ Protected against promise rejection:', message);
              event.preventDefault();
              return false;
            }
          }
        });

        // Debug logging
        setTimeout(() => {
          console.log('🛡️ Protection metrics:', protectionMetrics);
        }, 1000);

      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
