<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Assistant de Cours | LearnWorlds</title>
    <meta name="description" content="Assistant de cours alimenté par l'IA pour LearnWorlds. Posez des questions sur le contenu de vos cours et obtenez des réponses précises." />
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" href="/images/teacher_professional.jpg">
    <!-- Preload fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Open Graph tags -->
    <meta property="og:title" content="Assistant de Cours | LearnWorlds" />
    <meta property="og:description" content="Chatbot intelligent pour répondre à vos questions sur le contenu des cours" />
    <meta property="og:type" content="website" />

    <!-- Content Security Policy for External Script Control -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; object-src 'none'; base-uri 'self';">
    
    <!-- Ultra-Early Custom Element Protection System -->
    <script>
      (function() {
        'use strict';
        
        console.log('🛡️ ULTRA-EARLY: Initializing bulletproof custom element protection...');

        // Freeze customElements object immediately to prevent tampering
        const originalDefine = window.customElements.define.bind(window.customElements);
        const originalGet = window.customElements.get.bind(window.customElements);
        
        // Comprehensive blocking registry
        const BLOCKED_ELEMENTS = Object.freeze(new Set([
          'mce-autosize-textarea', 
          'autosize-textarea',
          'vite-error-overlay',
          'replit-error-overlay',
          'webcomponent-error-overlay',
          'cartographer-overlay',
          'runtime-error-modal',
          'dev-error-overlay',
          'webpack-dev-server-client',
          'hot-reload-overlay',
          'webcomponents-loader',
          'webcomponents-ce',
          'overlay_bundle',
          'vercel-live-feedback'
        ]));

        const BLOCKED_PATTERNS = Object.freeze([
          /^mce-.*$/,
          /^vite-.*$/,
          /^replit-.*$/,
          /^dev-.*$/,
          /^error-.*$/,
          /^runtime-.*$/,
          /^webcomponent.*$/,
          /^overlay.*$/,
          /^cartographer.*$/,
          /^vercel-.*$/
        ]);

        // Tracking registry (frozen for security)
        const registeredElements = new Set();
        let protectionActive = true;
        const metrics = {
          blocked: 0,
          allowed: 0,
          errors: 0,
          startTime: Date.now()
        };

        // Ultra-aggressive blocking logic
        function isBlocked(name) {
          if (!name || typeof name !== 'string') return true;
          if (BLOCKED_ELEMENTS.has(name)) return true;
          if (BLOCKED_PATTERNS.some(pattern => pattern.test(name))) return true;
          if (registeredElements.has(name)) return true;
          if (originalGet(name)) return true;
          return false;
        }

        // Bulletproof define override
        function protectedDefine(name, constructor, options) {
          if (!protectionActive) return originalDefine(name, constructor, options);
          
          try {
            if (isBlocked(name)) {
              metrics.blocked++;
              console.warn(`🚫 ULTRA-BLOCKED: "${name}" - Bulletproof protection active`);
              // Return empty class to prevent errors
              return function() {};
            }

            registeredElements.add(name);
            metrics.allowed++;
            console.log(`✅ ALLOWED: "${name}"`);
            return originalDefine(name, constructor, options);

          } catch (error) {
            registeredElements.delete(name);
            
            if (error && error.message && error.message.includes('already been defined')) {
              metrics.blocked++;
              console.warn(`🔄 CONFLICT RESOLVED: "${name}" - Already defined, ignored`);
              return function() {};
            }
            
            metrics.errors++;
            console.error(`❌ DEFINE ERROR: "${name}":`, error);
            throw error;
          }
        }

        // Replace native define method
        Object.defineProperty(window.customElements, 'define', {
          value: protectedDefine,
          writable: false,
          configurable: false,
          enumerable: true
        });

        // Global error protection
        function protectAgainstCustomElementErrors(event) {
          if (event.error && event.error.message) {
            const message = event.error.message;
            if (
              message.includes('already been defined') ||
              message.includes('custom element') ||
              message.includes('mce-autosize-textarea') ||
              message.includes('webcomponents-ce') ||
              message.includes('overlay_bundle')
            ) {
              metrics.errors++;
              console.warn('🛡️ INTERCEPTED ERROR:', message);
              event.preventDefault();
              event.stopImmediatePropagation();
              return false;
            }
          }
        }

        // Install global error handlers with highest priority
        window.addEventListener('error', protectAgainstCustomElementErrors, { 
          capture: true, 
          passive: false 
        });
        
        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason) {
            const message = String(event.reason.message || event.reason);
            if (
              message.includes('already been defined') ||
              message.includes('custom element') ||
              message.includes('webcomponents')
            ) {
              metrics.errors++;
              console.warn('🛡️ INTERCEPTED PROMISE REJECTION:', message);
              event.preventDefault();
              return false;
            }
          }
        }, { passive: false });

        // Protection monitoring
        setTimeout(() => {
          const uptime = Date.now() - metrics.startTime;
          console.log('🛡️ PROTECTION METRICS:', { 
            ...metrics, 
            uptime: uptime + 'ms',
            elementsTracked: registeredElements.size
          });
        }, 2000);

        // Expose emergency controls
        window.__ECOS_ELEMENT_PROTECTION__ = Object.freeze({
          metrics: () => ({ ...metrics }),
          registeredElements: () => Array.from(registeredElements),
          disable: () => { protectionActive = false; console.warn('🚨 Protection disabled!'); },
          enable: () => { protectionActive = true; console.log('🛡️ Protection re-enabled!'); }
        });

        console.log('🛡️ ULTRA-EARLY: Bulletproof protection system active!');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
