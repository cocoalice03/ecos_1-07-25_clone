  <head>
    <!-- IMMEDIATE: Custom Element Protection - Load FIRST -->
    <script>
      (function() {
        'use strict';
        console.log('🚨 IMMEDIATE PROTECTION: Blocking custom elements before ANY other script loads');
        
        // Store original method IMMEDIATELY
        const originalDefine = window.customElements.define.bind(window.customElements);
        
        // IMMEDIATE block list
        const BLOCKED = new Set(['mce-autosize-textarea', 'webcomponents-ce', 'autosize-textarea']);
        
        // Replace define method INSTANTLY
        window.customElements.define = function(name, constructor, options) {
          if (BLOCKED.has(name)) {
            console.warn('🚫 IMMEDIATE BLOCK:', name);
            return class extends HTMLElement {};
          }
          return originalDefine(name, constructor, options);
        };
        
        console.log('✅ IMMEDIATE PROTECTION ACTIVE');
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <meta property="og:title" content="Assistant de Cours | LearnWorlds" />

    <!-- Ultra-Strict Content Security Policy for Maximum Protection -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com https://replit.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none';">
    
    <!-- EMERGENCY: Ultra-Early Custom Element Protection System - BULLETPROOF VERSION -->
    <script>
      (function() {
        'use strict';
        
        console.log('🛡️ EMERGENCY: Initializing maximum security custom element protection...');
        
        // PHASE 0: Immediate browser extension detection
        const browserExtensionIndicators = [
          'chrome-extension://',
          'moz-extension://',
          'ms-browser-extension://',
          'webkit-extension://'
        ];
        
        // Check for extension-injected scripts
        const hasExtensionScripts = Array.from(document.scripts || []).some(script => 
          script.src && browserExtensionIndicators.some(indicator => script.src.includes(indicator))
        );
        
        // Check for extension-modified global objects
        const hasModifiedGlobals = (
          window.__REACT_DEVTOOLS_GLOBAL_HOOK__ ||
          window.__VUE_DEVTOOLS_GLOBAL_HOOK__ ||
          window.chrome?.runtime?.onMessage ||
          window.browser?.runtime?.onMessage
        );
        
        if (hasExtensionScripts || hasModifiedGlobals) {
          console.warn('🚨 BROWSER EXTENSION DETECTED - Activating maximum protection level');
        }

        // PHASE 1: Immediate customElements protection
        // Backup original methods before any extension can override them
        const originalDefine = window.customElements.define.bind(window.customElements);
        const originalGet = window.customElements.get.bind(window.customElements);
        const originalWhenDefined = window.customElements.whenDefined.bind(window.customElements);
        
        // Freeze the customElements object to prevent tampering
        try {
          Object.freeze(window.customElements);
          console.log('✅ CustomElements registry frozen against tampering');
        } catch (e) {
          console.warn('⚠️ Could not freeze customElements registry - proceeding with enhanced protection');
        }
        
        // BULLETPROOF: Comprehensive blocking registry (MAXIMUM COVERAGE)
        const BLOCKED_ELEMENTS = Object.freeze(new Set([
          // TinyMCE and autosize elements
          'mce-autosize-textarea', 
          'autosize-textarea',
          'tinymce-textarea',
          'mce-editor',
          // Development overlays and error handlers
          'vite-error-overlay',
          'replit-error-overlay',
          'webcomponent-error-overlay',
          'cartographer-overlay',
          'runtime-error-modal',
          'dev-error-overlay',
          'webpack-dev-server-client',
          'hot-reload-overlay',
          // Web components polyfills and loaders
          'webcomponents-loader',
          'webcomponents-ce',
          'webcomponents-bundle',
          'custom-elements-polyfill',
          // Bundle and build tool elements
          'overlay_bundle',
          'overlay-bundle',
          'build-overlay',
          'bundle-overlay',
          // Platform and service elements
          'vercel-live-feedback',
          'replit-banner',
          'browser-extension-element',
          // Generic problematic patterns
          'unknown-element',
          'undefined-element'
        ]));

        // BULLETPROOF: Comprehensive pattern matching (MAXIMUM COVERAGE)
        const BLOCKED_PATTERNS = Object.freeze([
          // TinyMCE and editor patterns
          /^mce-.*$/,
          /^tinymce-.*$/,
          /^editor-.*$/,
          // Development and build tool patterns
          /^vite-.*$/,
          /^replit-.*$/,
          /^dev-.*$/,
          /^error-.*$/,
          /^runtime-.*$/,
          /^webpack-.*$/,
          /^build-.*$/,
          // Web components and polyfill patterns
          /^webcomponent.*$/,
          /^webcomponents.*$/,
          /^custom-element.*$/,
          /^polyfill-.*$/,
          // Overlay and modal patterns
          /^overlay.*$/,
          /^modal-.*$/,
          /^popup-.*$/,
          /^dialog-.*$/,
          // Service and platform patterns
          /^cartographer.*$/,
          /^vercel-.*$/,
          /^github-.*$/,
          /^chrome-.*$/,
          /^firefox-.*$/,
          // Extension and third-party patterns
          /^extension-.*$/,
          /^plugin-.*$/,
          /^addon-.*$/,
          /^third-party-.*$/,
          // Generic suspicious patterns
          /^unknown-.*$/,
          /^undefined-.*$/,
          /^temp-.*$/,
          /^tmp-.*$/,
          /.*-overlay$/,
          /.*-modal$/,
          /.*-popup$/,
          /.*-extension$/
        ]);

        // Tracking registry (frozen for security)
        const registeredElements = new Set();
        let protectionActive = true;
        const metrics = {
          blocked: 0,
          allowed: 0,
          errors: 0,
          startTime: Date.now()
        };

        // Ultra-aggressive blocking logic
        function isBlocked(name) {
          if (!name || typeof name !== 'string') return true;
          if (BLOCKED_ELEMENTS.has(name)) return true;
          if (BLOCKED_PATTERNS.some(pattern => pattern.test(name))) return true;
          if (registeredElements.has(name)) return true;
          if (originalGet(name)) return true;
          return false;
        }

        // EMERGENCY: Bulletproof define override with race condition protection
        function protectedDefine(name, constructor, options) {
          if (!protectionActive) return originalDefine(name, constructor, options);
          
          try {
            // IMMEDIATE: Check if element is blocked before ANY processing
            if (isBlocked(name)) {
              metrics.blocked++;
              console.error(`🚫 EMERGENCY BLOCKED: "${name}" - Maximum protection active`);
              console.warn(`🛡️ Potential browser extension or third-party script attempted to register: ${name}`);
              // Return empty constructor to prevent errors but log the attempt
              return class extends HTMLElement { 
                constructor() { 
                  super(); 
                  console.warn(`Blocked element ${name} was instantiated but is inert`);
                } 
              };
            }

            // VERIFICATION: Final safety check before allowing registration
            if (registeredElements.has(name)) {
              metrics.blocked++;
              console.warn(`🔄 RACE CONDITION DETECTED: "${name}" - Already in registry, blocking duplicate`);
              return class extends HTMLElement {};
            }
            
            registeredElements.add(name);
            metrics.allowed++;
            console.log(`✅ VERIFIED ALLOWED: "${name}"`);
            return originalDefine(name, constructor, options);

          } catch (error) {
            registeredElements.delete(name);
            
            if (error && error.message && error.message.includes('already been defined')) {
              metrics.blocked++;
              console.error(`🔄 CRITICAL CONFLICT RESOLVED: "${name}" - Already defined by external source`);
              console.warn(`🚨 External script (possibly browser extension) pre-registered: ${name}`);
              // Return mock element to prevent cascading errors
              return class extends HTMLElement { 
                constructor() { 
                  super();
                  this.setAttribute('data-blocked-duplicate', 'true');
                }
              };
            }
            
            metrics.errors++;
            console.error(`❌ CRITICAL DEFINE ERROR for "${name}":`, error);
            console.error('🚨 Stack trace:', error.stack);
            // Don't throw - return safe fallback to prevent app crash
            return class extends HTMLElement {};
          }
        }

        // Replace native define method
        Object.defineProperty(window.customElements, 'define', {
          value: protectedDefine,
          writable: false,
          configurable: false,
          enumerable: true
        });

        // EMERGENCY: Maximum strength global error protection
        function protectAgainstCustomElementErrors(event) {
          if (event.error && event.error.message) {
            const message = event.error.message;
            const suspiciousPatterns = [
              'already been defined',
              'custom element',
              'mce-autosize-textarea',
              'webcomponents-ce',
              'overlay_bundle',
              'CustomElementRegistry',
              'define is not a function',
              'constructor.prototype.constructor',
              'Illegal constructor',
              'Class constructor',
              'TypeError: customElements',
              'DOMException',
              'InvalidCharacterError'
            ];
            
            if (suspiciousPatterns.some(pattern => message.includes(pattern))) {
              metrics.errors++;
              console.error('🚨 CRITICAL ERROR INTERCEPTED:', message);
              console.error('🛡️ Source:', event.error.stack || 'Unknown');
              console.warn('📝 Likely cause: Browser extension or third-party script conflict');
              event.preventDefault();
              event.stopImmediatePropagation();
              return false;
            }
          }
        }

        // Install global error handlers with highest priority
        window.addEventListener('error', protectAgainstCustomElementErrors, { 
          capture: true, 
          passive: false 
        });
        
        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason) {
            const message = String(event.reason.message || event.reason);
            const suspiciousPatterns = [
              'already been defined',
              'custom element',
              'webcomponents',
              'CustomElementRegistry',
              'mce-autosize-textarea',
              'overlay_bundle',
              'define is not a function'
            ];
            
            if (suspiciousPatterns.some(pattern => message.includes(pattern))) {
              metrics.errors++;
              console.error('🚨 CRITICAL PROMISE REJECTION INTERCEPTED:', message);
              console.error('🛡️ Reason:', event.reason);
              console.warn('📝 Likely cause: Asynchronous browser extension conflict');
              event.preventDefault();
              return false;
            }
          }
        }, { passive: false });

        // EMERGENCY: Enhanced protection monitoring with threat detection
        setTimeout(() => {
          const uptime = Date.now() - metrics.startTime;
          const threatLevel = metrics.blocked > 5 ? 'HIGH' : metrics.blocked > 2 ? 'MEDIUM' : 'LOW';
          console.log('🛡️ BULLETPROOF PROTECTION METRICS:', { 
            ...metrics, 
            uptime: uptime + 'ms',
            elementsTracked: registeredElements.size,
            threatLevel: threatLevel,
            blockedElements: Array.from(registeredElements)
          });
          
          if (metrics.blocked > 0) {
            console.warn(`🚨 THREAT DETECTED: ${metrics.blocked} malicious element registration attempts blocked`);
            console.warn('📝 Recommendations: Check for browser extensions or third-party scripts');
          }
        }, 2000);
        
        // Additional monitoring every 10 seconds
        setInterval(() => {
          if (metrics.blocked > 0 || metrics.errors > 0) {
            console.warn('🛡️ ONGOING PROTECTION ACTIVE - Threats detected:', {
              blocked: metrics.blocked,
              errors: metrics.errors,
              timestamp: new Date().toISOString()
            });
          }
        }, 10000);

        // Expose emergency controls
        window.__ECOS_ELEMENT_PROTECTION__ = Object.freeze({
          metrics: () => ({ ...metrics }),
          registeredElements: () => Array.from(registeredElements),
          disable: () => { protectionActive = false; console.warn('🚨 Protection disabled!'); },
          enable: () => { protectionActive = true; console.log('🛡️ Protection re-enabled!'); }
        });

        // FINAL: Ultra-early timing check
        if (document.readyState === 'loading') {
          console.log('✅ OPTIMAL TIMING: Protection system initialized before DOM ready');
        } else {
          console.warn('⚠️ LATE INITIALIZATION: Protection system started after DOM ready - may miss some threats');
        }
        
        console.log('🛡️ EMERGENCY PROTECTION ACTIVE: Bulletproof system operational!');
        console.log('📊 System Status:', {
          blockedElementsCount: BLOCKED_ELEMENTS.size,
          blockedPatternsCount: BLOCKED_PATTERNS.length,
          protectionActive: true,
          timestamp: new Date().toISOString()
        });
        
        // NUCLEAR OPTION: Completely freeze customElements to prevent ANY external access
        try {
          Object.defineProperty(window, 'customElements', {
            value: new Proxy(window.customElements, {
              get(target, prop) {
                if (prop === 'define') {
                  return protectedDefine;
                }
                return target[prop];
              },
              set() {
                console.warn('🚫 NUCLEAR BLOCK: Attempt to override customElements blocked');
                return false;
              }
            }),
            writable: false,
            configurable: false
          });
          console.log('🚀 NUCLEAR PROTECTION: customElements completely locked down');
        } catch (e) {
          console.warn('⚠️ Could not apply nuclear protection:', e.message);
        }
      })();
    </script>
  </head>
